<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoveyPlanner</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/editor.css" />
    <link rel="stylesheet" href="Planner.Client#[.{fingerprint}].styles.css" />
    <link rel="stylesheet" href="css/themes.css" />
    <script>
        // Тема оформления — до первой отрисовки, чтобы страница не мигала «Лотосом» (см. js/theme.js)
        try {
            document.documentElement.dataset.theme = localStorage.getItem('planner.theme') || 'lotus';
        } catch {
            document.documentElement.dataset.theme = 'lotus';
        }
    </script>
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        Произошла ошибка.
        <a href="." class="reload">Перезагрузить</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        // Страница уже шла из кеша прежней версии, а новая версия (после обновления) взяла управление —
        // перезагружаемся один раз, чтобы страница, стили и скрипты были из одной версии
        if (navigator.serviceWorker.controller) {
            let reloading = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!reloading) {
                    reloading = true;
                    location.reload();
                }
            });
        }
        navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });
    </script>
</body>

</html>

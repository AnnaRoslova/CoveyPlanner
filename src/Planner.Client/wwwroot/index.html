<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Цвет рамки окна установленного приложения; при смене темы — под её фон (js/theme.js) -->
    <meta name="theme-color" content="#d3ece4" />
    <title>CoveyPlanner</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/editor.css" />
    <link rel="stylesheet" href="Planner.Client#[.{fingerprint}].styles.css" />
    <link rel="stylesheet" href="css/themes.css" />
    <script>
        // Тема оформления — до первой отрисовки, чтобы страница не мигала «Лотосом» (см. js/theme.js)
        try {
            let theme = localStorage.getItem('planner.theme') || 'lotus';
            if (theme === 'night') {
                // «Ночь» заменена «Обсидианом»
                theme = 'obsidian';
                localStorage.setItem('planner.theme', theme);
            }
            document.documentElement.dataset.theme = theme;
        } catch {
            document.documentElement.dataset.theme = 'lotus';
        }
        // Стили уже загружены (скрипт ждёт их) — рамка окна сразу в цвет фона темы
        const pageColor = getComputedStyle(document.documentElement).getPropertyValue('--page-color').trim();
        if (pageColor) {
            document.querySelector('meta[name="theme-color"]').content = pageColor;
        }
    </script>
    <!-- Иконки — из docs/icon-1024.png (tools/icons.ps1) -->
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        Произошла ошибка.
        <a href="." class="reload">Перезагрузить</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        // Страница уже шла из кеша прежней версии, а новая версия (после обновления) взяла управление —
        // перезагружаемся один раз, чтобы страница, стили и скрипты были из одной версии
        if (navigator.serviceWorker.controller) {
            let reloading = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!reloading) {
                    reloading = true;
                    location.reload();
                }
            });
        }
        navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });
    </script>
</body>

</html>
